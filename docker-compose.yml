# Flowmator with its data in a named volume.
#   docker compose up -d        → http://localhost:5678
# Settings are FLOWMATOR_* variables; put overrides in a .env file next to this one.

services:
  flowmator:
    image: flowmator:latest
    build: .
    restart: unless-stopped
    ports:
      - "${FLOWMATOR_PORT:-5678}:5678"
    environment:
      # the public address of this instance, used for webhook and OAuth callback URLs
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Europe/Madrid}
      - TZ=${GENERIC_TIMEZONE:-Europe/Madrid}
      # optional: email invitations and password resets (without it the editor gives you links to send)
      - FLOWMATOR_EMAIL_MODE=${FLOWMATOR_EMAIL_MODE:-}
      - FLOWMATOR_SMTP_HOST=${FLOWMATOR_SMTP_HOST:-}
      - FLOWMATOR_SMTP_PORT=${FLOWMATOR_SMTP_PORT:-465}
      - FLOWMATOR_SMTP_USER=${FLOWMATOR_SMTP_USER:-}
      - FLOWMATOR_SMTP_PASS=${FLOWMATOR_SMTP_PASS:-}
      - FLOWMATOR_SMTP_SENDER=${FLOWMATOR_SMTP_SENDER:-}
      - FLOWMATOR_SMTP_SSL=${FLOWMATOR_SMTP_SSL:-true}
      # optional: set it to keep credentials readable if the volume's config.json is lost
      - FLOWMATOR_ENCRYPTION_KEY=${FLOWMATOR_ENCRYPTION_KEY:-}
    volumes:
      - flowmator_data:/home/node/.flowmator

volumes:
  flowmator_data:
